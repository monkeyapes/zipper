name: Build Zipper APK + Addon

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode addon
        run: pwsh -File decode_addon.ps1

      - name: Copy addon to Android assets
        run: |
          mkdir -p android/app/src/main/assets/addon
          cp -r addon/* android/app/src/main/assets/addon/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build addon .mcaddon
        run: |
          python addon/build_addon.py
          python addon/build_test_addon.py

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Copy artifacts
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/Zipper.apk || true
          cp build/LocalName.mcaddon artifacts/ || true
          cp build/LocalName_Test.mcaddon artifacts/ || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Zipper.apk
            artifacts/LocalName.mcaddon
            artifacts/LocalName_Test.mcaddon
          generate_release_notes: true
